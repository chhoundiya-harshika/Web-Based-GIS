services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: webgis
      POSTGRES_USER: gisuser
      POSTGRES_PASSWORD: gispassword
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gisuser -d webgis"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://gisuser:gispassword@db:5432/webgis
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
